<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학교육론 막바지 인출 앱</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Pretendard Font -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <style>
        body {
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
            background-color: #f8fafc; /* slate-50 */
            color: #334155; /* slate-700 */
            -webkit-tap-highlight-color: transparent;
        }

        /* 빵꾸노트 Input 스타일 */
        .blank-input {
            border: none;
            border-bottom: 2px solid #94a3b8; /* slate-400 */
            background-color: transparent;
            text-align: center;
            outline: none;
            transition: all 0.2s ease;
            margin: 0 4px;
            padding: 0 4px;
            border-radius: 4px 4px 0 0;
            color: #0f172a; /* slate-900 */
            font-weight: 500;
        }
        .blank-input:focus {
            border-bottom-color: #6366f1; /* indigo-500 */
            background-color: #e0e7ff; /* indigo-50 */
        }
        
        /* 빵꾸노트 정답 처리 스타일 */
        .blank-input.correct {
            border-bottom-color: #10b981 !important; /* emerald-500 */
            background-color: #d1fae5 !important; /* emerald-100 */
            color: #047857 !important; /* emerald-700 */
            font-weight: 700;
        }
        
        /* 빵꾸노트 오답(정답 노출) 처리 스타일 */
        .blank-input.wrong-revealed {
            border-bottom-color: #f43f5e !important; /* rose-500 */
            background-color: #ffe4e6 !important; /* rose-100 */
            color: #be123c !important; /* rose-700 */
            font-weight: 700;
            text-decoration: underline;
            text-decoration-color: #f43f5e;
            text-decoration-thickness: 2px;
        }

        /* 스크롤바 숨기기 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* 해설 박스 애니메이션 */
        .exp-box {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, opacity 0.4s ease-out, margin 0.4s ease-out;
            opacity: 0;
        }
        .exp-box.show {
            max-height: 500px; /* 임의의 큰 값 */
            opacity: 1;
            margin-top: 1rem;
        }
    </style>
</head>
<body class="pb-24">

    <!-- Header & Tabs (Sticky) -->
    <header class="sticky top-0 z-50 bg-white shadow-sm">
        <div class="max-w-4xl mx-auto">
            <div class="px-4 py-4 md:py-6 bg-indigo-600 text-white flex justify-between items-center rounded-b-xl shadow-lg">
                <h1 class="text-xl md:text-2xl font-bold tracking-tight">수교론 완벽 인출 🧠</h1>
                <div class="text-sm font-medium bg-indigo-800 px-3 py-1 rounded-full">D-DAY 🔥</div>
            </div>

            <!-- Tab Buttons -->
            <div class="flex border-b border-slate-200">
                <button id="tab-fill" class="flex-1 py-3 text-center font-bold text-indigo-600 border-b-4 border-indigo-600 transition-colors" onclick="switchTab('fill')">
                    📝 빵꾸노트
                </button>
                <button id="tab-quiz" class="flex-1 py-3 text-center font-medium text-slate-400 border-b-4 border-transparent hover:text-slate-600 transition-colors" onclick="switchTab('quiz')">
                    🎯 객관식 풀이
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="px-4 py-3 bg-white">
                <div class="flex justify-between text-xs font-semibold text-slate-500 mb-1">
                    <span>진행률 (<span id="progress-text">0/0</span>)</span>
                    <div class="flex gap-2">
                        <span class="text-emerald-500">맞힘 <span id="count-correct">0</span></span>
                        <span class="text-rose-500">오답/노출 <span id="count-wrong">0</span></span>
                    </div>
                </div>
                <div class="h-2 w-full bg-slate-200 rounded-full overflow-hidden flex">
                    <div id="bar-correct" class="h-full bg-emerald-500 transition-all duration-300" style="width: 0%"></div>
                    <div id="bar-wrong" class="h-full bg-rose-500 transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-4xl mx-auto px-4 py-6">
        
        <!-- ================= [빵꾸노트 뷰] ================= -->
        <section id="view-fill" class="block">
            <!-- Category Filter -->
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-2 mb-6" id="category-container">
                <!-- Categories rendered here -->
            </div>

            <div class="flex justify-between items-end mb-4">
                <h2 class="text-xl font-bold text-slate-800" id="current-category-title">전체</h2>
                <button onclick="revealAllUnanswered()" class="text-sm font-semibold text-rose-500 bg-rose-50 px-3 py-1.5 rounded-lg border border-rose-200 hover:bg-rose-100 transition-colors shadow-sm">
                    🚨 미답변 정답 보기
                </button>
            </div>

            <!-- Fill Blanks Content -->
            <div id="fill-content" class="space-y-4">
                <!-- Sentences rendered here -->
            </div>
        </section>


        <!-- ================= [객관식 뷰] ================= -->
        <section id="view-quiz" class="hidden">
            <!-- Quiz Set Filter -->
            <div class="flex gap-2 overflow-x-auto no-scrollbar py-2 mb-4" id="quiz-set-container">
                <!-- Quiz sets rendered here -->
            </div>

            <div class="mb-6">
                <h2 class="text-xl font-bold text-slate-800">실전 객관식 트레이닝</h2>
                <p class="text-sm text-slate-500 mt-1">※ 한 번 선택하면 번복할 수 없습니다. 신중하게 선택하세요!</p>
            </div>
            
            <div id="quiz-content" class="space-y-8">
                <!-- Quizzes rendered here -->
            </div>
        </section>

    </main>

    <script>
        // ================= 데이터 정의 =================

        // 1. 빵꾸노트 데이터 (대폭 확장)
        const fillDataRaw = [
            { category: "수와 연산", sentences: [

                "음수의 발생 맥락은 방정식 풀이의 [일반성]을 확보하려는 형식적인 요구에서 비롯되었다.",
                "음수 지도 모델 중 [셈돌] 모델은 덧셈/뺄셈 설명에는 유용하나, 소멸법칙을 이해해야 하며 곱셈/나눗셈을 설명하려면 규칙을 강제로 선언해야 하는 한계가 있다.",
                "우체부 모델에서 어음은 양수, 고지서는 음수를 나타내며, 고지서를 '가져가는' 것은 [뺄셈]으로 해석한다.",
                "수직선 모델의 약점은 하나의 기호(-)가 왼쪽 방향, 반대 방향, 뺄셈 등 [다중적인] 의미를 내포하게 된다는 점이다.",
                "어떤 대수적 구조를 확장할 때 기존 체계에서 인정된 성질이 유지되도록 하는 것을 [형식불역의 원리]라고 한다.",
                "해석 기하학의 도입은 대수적 사고뿐만 아니라 기하적인 의미에서도 연산 구조를 유지하며 확장된다는 [기하적]·대수적 형식 불역의 원리를 보여준다."
            ]},
            { category: "대수", sentences: [
                "대수 발달 단계 중 미지수를 기호로 나타내고 일반해를 공식화하는 단계는 [기호적] 대수 단계이다.",
                "학생들은 식 자체를 하나의 대상으로 받아들이지 못하고 연산을 실행하여 완결시켜야 한다고 생각하는데, 이는 [산술] 학습의 영향이다.",
                "변수의 본질은 변하는 대상(동적)과 [다가이름](정적)이라는 두 가지 측면이 있다.",
                "방정식 풀이에서 해결의 실마리를 찾기 위해 식을 변형하는 사고를 [변환추론]이라고 한다.",
                "대수를 문제 해결 과정의 학습으로 볼 때, 변수는 방정식의 해에 대한 자리지기인 [미지수]로 생각된다.",
                "대수에서 다루는 군, 환, 체와 같은 추상구조에서 변수는 어떤 성질을 만족하는 [임의의 대상]을 나타내는 기호에 지나지 않는다.",
                "문자는 일상언어와 달리 고정된 의미의 집합에 연결되어 있지 않다는 [한계 결정의 자유성]을 지닌다.",
                "대수에서 등호 개념은 결과를 얻는 과정(산술적 해석)이 아니라 [동치] 개념의 이해와 연결되어야 한다."
            ]},
            { category: "함수", sentences: [

                "Euler는 하나의 해석적 표현이 가능한 함수를 연속 함수라 하였으나, Dirichlet는 규칙성에 얽매이지 않는 [임의의 대응]으로 함수를 정의하였다.",
                "곡선이 다가함수 형태를 띠게 되고 미분 시 혼란을 막기 위해 함수를 [일가성]을 가진 대응으로 제한하게 되었다.",
                "Freudenthal의 교수학적 현상학에 따르면, 함수는 다양한 현상에서 출발하여 점진적으로 형식적 지도로 나아가는 [수학화] 과정을 거쳐야 한다.",

                "함수 그래프 해석 중, 어떤 상황을 수량화되지 않은 상태로 개략적으로 표현하고 설명하는 것을 [질적] 접근이라 한다."
            ]},
            { category: "기하와 증명", sentences: [
                "인간이 직관적으로 자명하게 참으로 인정하는 사실을 공리와 공준으로 상정하고, 이를 바탕으로 명제를 이끌어내는 것을 [공리적] 방법이라 한다.",

                "결론이 참인 것으로 가정하고, 참이 되기 위한 선행 조건(충분조건)을 거꾸로 탐색해 나가는 증명 방식을 [분석적] 방법이라 한다.",
                "Euclid 기하의 평행선 공준 대신 다른 공준을 내세운 기하 체계를 [비유클리드] 기하라고 한다.",
                "Freudenthal은 기하 전체 영역을 공리로부터 조직하는 '전체적 조직화'보다, 학습자의 실제로부터 출발하는 [국소적 조직화]를 강조했다.",
                "학생들이 개념을 설명하기 위해 제시된 그림(사례)에 얽매여 비본질적인 요소까지 포함시키는 오류(개념의 고착화)를 방지하기 위해, Dienes의 [수학적 다양성]의 원리가 필요하다.",
                "Lakatos에 따르면 증명의 본질은 [사고 실험]이며, 추측을 부분 추측으로 분해하여 지식체에 연결하는 과정이다.",
                "어떤 대상에서 두드러지는 개념이 그 대상을 다른 개념으로 해석하는 것을 방해하는 것을 [선행 개념]의 방해라고 한다."
            ]},
            { category: "확률과 통계", sentences: [
                "Fischbein은 확률 개념을 바르게 이해하려면 일상적이고 자연스러운 [직관]을 거부하는 태도가 필요하다고 보았다.",
                "판단을 내릴 때 표본의 크기에 관계없이 모집단과 유사할 것이라고 기대하는 전략을 [대표성] 전략이라고 한다.",
                "통계그래프를 다각도로 분석하여 자료 이면에 담긴 의미를 도출할 수 있는 특성을 [현시성]이라고 한다.",
                "일부 자료가 파손되어도 자료 전체에 대하여 비교적 합리적인 해석을 내릴 수 있다는 의미로, 평균보다 중앙값을 선호하게 되는 근거는 [저항성]이다.",
                "Wild & Pfannkuch의 통계적 탐구 활동 과정은 문제, [계획], 자료, 분석, [결론]의 단계로 이루어진다.",
                "Sfard에 따르면 '자연수 범위에서 큰 수에서 작은 수를 뺄 수 있다'와 같이 수학적 대상을 조절하는 포괄적 활동은 [메타]수준에 해당한다.",
                "자료집합을 직접 생성하게 하는 과제는 단순히 지식을 회상하는 것을 넘어 [가역적] 사고를 촉진한다."
            ]},
            { category: "미분과 적분", sentences: [

                "Sfard의 개념 형성 단계 중, 복잡한 조작 과정을 하나의 추상적인 대상으로 인식하게 되는 단계를 [실재화]라고 한다.",
                "수열의 극한을 지도할 때, 역사적 발달 순서를 존중하되 학생의 수준에 맞게 재구성하는 원리는 [역사발생적] 원리이다.",
                "학생들은 연속함수를 판단할 때 '개념 정의'보다 그래프가 이어져 있다는 직관적인 [개념 이미지]에 의존하여 오개념을 낳기도 한다.",
                "극한의 직관적 정의는 n이 변화함에 따른 '과정'에 초점을 두는 반면, 형식적 정의는 조건을 만족하는 '결과'로서의 극한값에 주목하는 [정적인] 특성을 지닌다.",
                "미적분학의 기본정리는 역사적으로 별개인 것으로 보이던 미분과 적분이 서로 [역연산]임을 밝혀주었다.",
                "수열을 ε-N 논법으로 정의할 때에는 '원인→결과'라는 자연스러운 사고 방향을 역행하는 논리적인 [반전]이 뒤따라야 하므로 이해에 어려움이 따른다."
            ]}
        ];

        // 2. 실전 객관식 데이터 (총 60제, 3세트로 분할)
        const quizDataSets = [
            // ================= SET 1 (20제) =================
            [

            let match;
            let html = text;
            let answers = [];
            let blankIndex = 0;
            
            while ((match = regex.exec(text)) !== null) {

                answers.push(answer);

                html = html.replace(`[${answer}]`, inputTag);
                blankIndex++;
            }
            return { html, answers };
        }

        // ================= UI 렌더링 =================

        function renderCategoryFilter() {
            const container = document.getElementById('category-container');
            const categories = ['전체', ...fillDataRaw.map(d => d.category)];
            
            container.innerHTML = categories.map(cat => `
                <button onclick="filterCategory('${cat}')" 
                    class="whitespace-nowrap px-4 py-2 rounded-full text-sm font-semibold transition-colors ${currentCategory === cat ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">
                    ${cat}
                </button>
            `).join('');
            
            document.getElementById('current-category-title').innerText = currentCategory;
        }

        function filterCategory(cat) {
            currentCategory = cat;
            renderCategoryFilter();
            renderFillContent();
        }

        function renderQuizSetFilter() {
            const container = document.getElementById('quiz-set-container');
            container.innerHTML = quizDataSets.map((_, i) => `
                <button onclick="selectQuizSet(${i})" 
                    class="whitespace-nowrap px-4 py-2 rounded-full text-sm font-semibold transition-colors ${currentQuizSetIndex === i ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">
                    Set ${i + 1}
                </button>
            `).join('');
        }

        function selectQuizSet(index) {
            currentQuizSetIndex = index;
            renderQuizSetFilter();
            renderQuizContent();
        }

        function renderFillContent() {
            const container = document.getElementById('fill-content');
            
            const filtered = currentCategory === '전체' 
                ? fillQuestions 
                : fillQuestions.filter(q => q.category === currentCategory);

            container.innerHTML = filtered.map((q, i) => `
                <div class="bg-white p-4 md:p-5 rounded-xl shadow-sm border border-slate-100 text-base md:text-lg leading-relaxed" data-id="${q.id}">
                    <span class="inline-block bg-indigo-100 text-indigo-700 text-xs font-bold px-2 py-1 rounded mb-2">${q.category}</span><br>
                    ${q.html}
                </div>
            `).join('');
            
            recalculateProgress();
        }

        function renderQuizContent() {
            const container = document.getElementById('quiz-content');
            const currentQuizSet = quizDataSets[currentQuizSetIndex];
            const currentState = quizStates[currentQuizSetIndex];
            
            // UI에 현재 세트 번호(1~3) 표시
            const titleEl = document.querySelector('#view-quiz h2');
            if (titleEl) {
                titleEl.innerText = `실전 객관식 트레이닝 (Set ${currentQuizSetIndex + 1})`;
            }
            
            container.innerHTML = currentQuizSet.map((q, i) => {
                const state = currentState[i];
                const isSolved = state !== null;
                
                return `
                <div class="bg-white p-5 md:p-6 rounded-xl shadow-sm border border-slate-200" id="quiz-box-${i}">
                    <div class="font-bold text-indigo-600 mb-3 text-sm">Q${i+1}.</div>
                    <p class="font-semibold text-lg mb-5">${q.q}</p>
                    <div class="space-y-3">
                        ${q.shuffledOptions.map((opt, optIdx) => {
                            let btnClasses = 'w-full text-left p-4 rounded-lg border-2 transition-all font-medium';
                            if (!isSolved) {
                                btnClasses += ' border-slate-100 hover:border-indigo-300 hover:bg-indigo-50 text-slate-700';
                            } else {
                                if (opt.originalIdx === q.ans) {
                                    btnClasses += ' border-emerald-500 bg-emerald-100 text-emerald-800';
                                } else if (opt.originalIdx === state.selectedOriginalIdx && !state.isCorrect) {
                                    btnClasses += ' border-rose-500 bg-rose-100 text-rose-800';
                                } else {
                                    btnClasses += ' border-slate-100 text-slate-700 opacity-50';
                                }
                            }
                            
                            return `<button onclick="handleQuizAnswer(${i}, ${optIdx}, ${opt.originalIdx})" id="quiz-btn-${i}-${optIdx}"
                                class="${btnClasses}" ${isSolved ? 'disabled' : ''}>
                                ${optIdx + 1}. ${opt.text}
                            </button>`;
                        }).join('')}
                    </div>
                    <!-- 해설 박스 -->
                    <div id="exp-box-${i}" class="exp-box bg-slate-50 border border-slate-200 rounded-lg p-4 ${isSolved ? 'show' : ''}" ${isSolved ? 'style="max-height:500px; opacity:1; margin-top:1rem;"' : ''}>
                        <div class="flex items-start gap-2">
                            <span class="text-xl">💡</span>
                            <div>
                                <h4 class="font-bold text-slate-800 mb-1">핵심 해설</h4>
                                <p class="text-slate-600 text-sm leading-relaxed">${q.exp}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `}).join('');
            
            recalculateProgress();
        }

        // ================= 빵꾸노트 로직 =================

        // 이벤트 위임 처리
        document.getElementById('fill-content').addEventListener('input', handleInput);
        document.getElementById('fill-content').addEventListener('keydown', handleKeydown);
        document.getElementById('fill-content').addEventListener('focusout', handleBlur);

        function handleInput(e) {
            if (e.target.tagName !== 'INPUT') return;
            const input = e.target;
            if (input.dataset.solved === 'true') return;

            const ans = input.dataset.ans;
            const val = input.value.trim();

            if (val === ans) {
                markCorrect(input);
                focusNext(input);
                updateProgressUI();
            }
        }

        function handleKeydown(e) {
            if (e.target.tagName !== 'INPUT') return;
            if (e.key === 'Enter') {
                e.preventDefault();
                const input = e.target;
                if (input.dataset.solved === 'true') return;

                const ans = input.dataset.ans;
                const val = input.value.trim();

                if (val === ans) {
                    markCorrect(input);
                } else {
                    markWrong(input, val);
                }
                focusNext(input);
                updateProgressUI();
            }
        }

        function handleBlur(e) {
            if (e.target.tagName !== 'INPUT') return;
            const input = e.target;
            if (input.dataset.solved === 'true') return;

            const val = input.value.trim();
            if (val !== "") {
                const ans = input.dataset.ans;
                if (val === ans) {
                    markCorrect(input);
                } else {
                    markWrong(input, val);
                }
                updateProgressUI();
            }
        }

        function markCorrect(input) {
            input.value = input.dataset.ans;
            input.classList.add('correct');
            input.dataset.solved = 'true';
            input.disabled = true;
        }

        function markWrong(input, wrongVal) {
            input.value = input.dataset.ans;
            input.classList.add('wrong-revealed');
            input.dataset.solved = 'true';
            input.disabled = true;
            input.title = `나의 오답: ${wrongVal || '빈칸'}`;
        }

        function focusNext(currentInput) {
            const inputs = Array.from(document.querySelectorAll('.blank-input'));
            const index = inputs.indexOf(currentInput);
            if (index > -1 && index < inputs.length - 1) {
                // 아직 풀리지 않은 다음 인풋 찾기
                for(let i = index + 1; i < inputs.length; i++) {
                    if (inputs[i].dataset.solved !== 'true') {
                        inputs[i].focus();
                        break;
                    }
                }
            }
        }

        function revealAllUnanswered() {
            const inputs = document.querySelectorAll('.blank-input[data-solved="false"]');
            inputs.forEach(input => {
                markWrong(input, "");
            });
            updateProgressUI();
        }


        // ================= 객관식 로직 =================
        
        function handleQuizAnswer(qIdx, selectedRenderIdx, selectedOriginalIdx) {
            const currentState = quizStates[currentQuizSetIndex];
            if (currentState[qIdx] !== null) return; // 이미 풀었으면 무시

            const currentQuizSet = quizDataSets[currentQuizSetIndex];
            const qData = currentQuizSet[qIdx];
            const isCorrect = (qData.ans === selectedOriginalIdx);
            
            currentState[qIdx] = { isCorrect, selectedRenderIdx, selectedOriginalIdx };

            // 모든 버튼 비활성화 및 스타일 처리
            const buttons = document.querySelectorAll(`[id^="quiz-btn-${qIdx}-"]`);
            buttons.forEach((btn, idx) => {
                btn.disabled = true;
                btn.classList.remove('hover:border-indigo-300', 'hover:bg-indigo-50');
                
                const optOriginalIdx = qData.shuffledOptions[idx].originalIdx;
                
                if (optOriginalIdx === qData.ans) {
                    // 원래 정답은 무조건 초록색 표시
                    btn.classList.add('border-emerald-500', 'bg-emerald-100', 'text-emerald-800');
                    btn.classList.remove('border-slate-100', 'text-slate-700');
                } else if (idx === selectedRenderIdx && !isCorrect) {
                    // 내가 누른 오답은 빨간색 표시
                    btn.classList.add('border-rose-500', 'bg-rose-100', 'text-rose-800');
                    btn.classList.remove('border-slate-100', 'text-slate-700');
                } else {
                    btn.classList.add('opacity-50');
                }
            });

            // 해설 박스 표시
            document.getElementById(`exp-box-${qIdx}`).classList.add('show');
            document.getElementById(`exp-box-${qIdx}`).style = ""; // 인라인 스타일 초기화
            
            updateProgressUI();
        }

        // ================= 공통 및 유틸 =================

        function switchTab(tabId) {
            currentTab = tabId;
            
            // UI 처리
            document.getElementById('tab-fill').className = tabId === 'fill' 
                ? "flex-1 py-3 text-center font-bold text-indigo-600 border-b-4 border-indigo-600 transition-colors"
                : "flex-1 py-3 text-center font-medium text-slate-400 border-b-4 border-transparent hover:text-slate-600 transition-colors";
            
            document.getElementById('tab-quiz').className = tabId === 'quiz' 
                ? "flex-1 py-3 text-center font-bold text-indigo-600 border-b-4 border-indigo-600 transition-colors"
                : "flex-1 py-3 text-center font-medium text-slate-400 border-b-4 border-transparent hover:text-slate-600 transition-colors";

            document.getElementById('view-fill').style.display = tabId === 'fill' ? 'block' : 'none';
            document.getElementById('view-quiz').style.display = tabId === 'quiz' ? 'block' : 'none';

            recalculateProgress();
        }

        function updateOverallCounts() {
            totalBlanksCount = fillQuestions.reduce((sum, q) => sum + q.blankCount, 0);
        }

        // 현재 뷰 상태에 맞춰 프로그레스 재계산
        function recalculateProgress() {
            updateProgressUI();
        }

        function updateProgressUI() {
            let total = 0;
            let correct = 0;
            let wrong = 0;

            if (currentTab === 'fill') {
                // DOM에 있는 input 기준 계산 (필터링 상태 반영)
                const inputs = document.querySelectorAll('.blank-input');
                total = inputs.length;
                inputs.forEach(input => {
                    if (input.classList.contains('correct')) correct++;
                    if (input.classList.contains('wrong-revealed')) wrong++;
                });
            } else {
                const currentSet = quizDataSets[currentQuizSetIndex];
                const currentState = quizStates[currentQuizSetIndex];
                total = currentSet.length;
                
                currentState.forEach(state => {
                    if (state !== null) {
                        if (state.isCorrect) correct++;
                        else wrong++;
                    }
                });
            }

            document.getElementById('progress-text').innerText = `${correct + wrong}/${total}`;
            document.getElementById('count-correct').innerText = correct;
            document.getElementById('count-wrong').innerText = wrong;

            const correctPercent = total === 0 ? 0 : (correct / total) * 100;
            const wrongPercent = total === 0 ? 0 : (wrong / total) * 100;

            document.getElementById('bar-correct').style.width = `${correctPercent}%`;
            document.getElementById('bar-wrong').style.width = `${wrongPercent}%`;
        }

        // 초기화
        window.onload = () => {
            initData();
            renderCategoryFilter();
            renderQuizSetFilter();
            renderFillContent();
            renderQuizContent();
            switchTab('fill'); // default
        };

    </script>
</body>
</html>
