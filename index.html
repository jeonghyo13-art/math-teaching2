<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>수학교육론 마스터: 인출 모의고사 100제</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <style>
        body {
            font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            -webkit-tap-highlight-color: transparent;
        }
        /* 빵꾸노트 Input */
        .blank-input {
            border: none;
            border-bottom: 2px solid #94a3b8;
            background-color: transparent;
            text-align: center;
            outline: none;
            transition: all 0.2s ease;
            margin: 0 4px;
            padding: 0 4px;
            border-radius: 4px 4px 0 0;
            color: #0f172a;
            font-weight: 500;
        }
        .blank-input:focus {
            border-bottom-color: #6366f1;
            background-color: #e0e7ff;
        }
        .blank-input.correct {
            border-bottom-color: #10b981 !important;
            background-color: #d1fae5 !important;
            color: #047857 !important;
            font-weight: 700;
        }
        .blank-input.wrong-revealed {
            border-bottom-color: #f43f5e !important;
            background-color: #ffe4e6 !important;
            color: #be123c !important;
            font-weight: 700;
            text-decoration: underline;
            text-decoration-color: #f43f5e;
            text-decoration-thickness: 2px;
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .exp-box {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, opacity 0.4s ease-out, margin 0.4s ease-out;
            opacity: 0;
        }
        .exp-box.show {
            max-height: 800px;
            opacity: 1;
            margin-top: 1rem;
        }
        /* 대시보드 카드 호버 효과 */
        .set-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="pb-24">

    <!-- Header & Tabs (Sticky) -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <span class="bg-indigo-600 text-white text-xs font-bold px-3 py-1.5 rounded-full">2026 임용 D-14</span>
                <h1 class="text-lg md:text-xl font-bold text-slate-800 tracking-tight">김민아 수학교육론 파이널</h1>
            </div>
            <div class="flex bg-slate-50 p-1 rounded-full border border-slate-200">
                <button id="nav-quiz" onclick="switchTab('quiz')" class="px-4 py-1.5 rounded-full text-sm font-bold bg-white text-indigo-700 shadow-sm border border-slate-200 flex items-center gap-1 transition-all">
                    📝 실전 객관식 100제
                </button>
                <button id="nav-fill" onclick="switchTab('fill')" class="px-4 py-1.5 rounded-full text-sm font-medium text-slate-500 hover:text-slate-800 border border-transparent flex items-center gap-1 transition-all">
                    ✍️ 빵꾸노트 인출
                </button>
            </div>
        </div>
        
        <!-- Progress Bar (Sticky) -->
        <div id="progress-container" class="max-w-6xl mx-auto px-4 py-3 bg-white hidden">
            <div class="flex justify-between text-xs font-semibold text-slate-500 mb-1.5">
                <span id="progress-title">진행률 (<span id="progress-text">0/0</span>)</span>
                <div class="flex gap-3">
                    <span class="text-emerald-500 flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>맞힘 <span id="count-correct">0</span>
                    </span>
                    <span class="text-rose-500 flex items-center gap-1">
                        <span class="w-2 h-2 rounded-full bg-rose-500"></span>오답 <span id="count-wrong">0</span>
                    </span>
                </div>
            </div>
            <div class="h-2.5 w-full bg-slate-100 rounded-full overflow-hidden flex shadow-inner">
                <div id="bar-correct" class="h-full bg-emerald-500 transition-all duration-500 ease-out" style="width: 0%"></div>
                <div id="bar-wrong" class="h-full bg-rose-500 transition-all duration-500 ease-out" style="width: 0%"></div>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-6xl mx-auto px-4 py-6">
        
        <!-- ================= [빵꾸노트 뷰] ================= -->
        <section id="view-fill" class="block">
            <div class="flex justify-between items-end mb-4">
                <div class="flex gap-2 overflow-x-auto no-scrollbar py-2" id="category-container">
                    <!-- Categories -->
                </div>
            </div>

            <div class="flex justify-between items-center mb-4 bg-slate-50 p-3 rounded-lg border border-slate-200">
                <h2 class="text-lg font-bold text-slate-700 flex items-center gap-2">
                    <span>📌</span> <span id="current-category-title">전체</span>
                </h2>
                <button onclick="revealAllUnanswered()" class="text-sm font-semibold text-rose-600 bg-rose-50 px-3 py-1.5 rounded-md border border-rose-200 hover:bg-rose-100 transition-colors shadow-sm">
                    🚨 남은 빈칸 정답 보기
                </button>
            </div>

            <!-- Fill Blanks Content -->
            <div id="fill-content" class="space-y-4"></div>
        </section>


        <!-- ================= [객관식 대시보드 뷰] ================= -->
        <section id="view-quiz-dashboard" class="hidden">
            <div class="flex flex-col items-center mt-8 mb-10 text-center">
                <span class="bg-indigo-50 text-indigo-600 text-xs font-bold px-4 py-1.5 rounded-full border border-indigo-100 mb-4">
                    파이널 전 범위 · 중복 없는 완전 신규 100문항
                </span>
                <h2 class="text-2xl md:text-3xl font-bold text-slate-900 mb-3 tracking-tight">임용고시 수학교육론 마스터: 핵심 이론 100제</h2>
                <p class="text-slate-500 text-sm md:text-base">20문항 × 5개 세트 구성 · 매 시작 및 새로고침 시 문항 순서와 4지선다 보기가 자동 셔플됩니다</p>
            </div>

            <div class="flex justify-center mb-10 overflow-x-auto no-scrollbar py-1">
                <div class="inline-flex bg-white rounded-full p-1 shadow-sm border border-slate-200 gap-1 whitespace-nowrap">
                    <button class="px-5 md:px-6 py-2 rounded-full text-sm font-bold bg-indigo-600 text-white shadow flex items-center gap-2">
                        📚 전체 세트 목록
                    </button>
                    <button class="px-4 md:px-5 py-2 rounded-full text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors" onclick="enterQuizSet(0)">1세트 (20제)</button>
                    <button class="px-4 md:px-5 py-2 rounded-full text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors" onclick="enterQuizSet(1)">2세트 (20제)</button>
                    <button class="px-4 md:px-5 py-2 rounded-full text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors" onclick="enterQuizSet(2)">3세트 (20제)</button>
                    <button class="px-4 md:px-5 py-2 rounded-full text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors" onclick="enterQuizSet(3)">4세트 (20제)</button>
                    <button class="px-4 md:px-5 py-2 rounded-full text-sm font-medium text-slate-600 hover:bg-slate-50 transition-colors" onclick="enterQuizSet(4)">5세트 (20제)</button>
                </div>
            </div>

            <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-4 px-1 gap-3">
                <div>
                    <h3 class="text-lg md:text-xl font-bold text-slate-800">학습할 모의고사 세트를 선택하세요</h3>
                    <p class="text-xs md:text-sm text-slate-500 mt-1">총 100문항이 주제별 5개 세트(각 20문항)로 체계적으로 구성되어 있습니다.</p>
                </div>
                <div class="text-xs md:text-sm font-semibold text-indigo-700 bg-indigo-50 px-3 py-1.5 rounded-md border border-indigo-100 flex items-center gap-1.5 shadow-sm">
                    <span>🔀</span> 맞히든 틀리든 진입 시마다 완전 리셋 및 무작위 재배치
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-5" id="dashboard-cards-container">
                <!-- Cards rendered by JS -->
            </div>
        </section>


        <!-- ================= [객관식 문제풀이 뷰] ================= -->
        <section id="view-quiz-solve" class="hidden">
            <div class="flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div>
                    <button onclick="backToDashboard()" class="text-slate-500 hover:text-indigo-600 font-semibold flex items-center gap-1 text-sm transition-colors mb-1">
                        ← 세트 목록으로 돌아가기
                    </button>
                    <h2 class="text-xl font-bold text-slate-800" id="solve-set-title"></h2>
                </div>
                <div class="text-right">
                    <div class="text-xs text-slate-400 font-medium mb-1">현재 세트 진행률</div>
                    <div class="text-lg font-bold text-indigo-600" id="solve-set-progress">0/20</div>
                </div>
            </div>
            
            <div id="quiz-content" class="space-y-6">
                <!-- Quizzes -->
            </div>

            <div class="mt-8 text-center">
                <button onclick="backToDashboard()" class="bg-slate-800 text-white px-6 py-3 rounded-lg font-bold hover:bg-slate-700 shadow-md transition-colors">
                    학습 종료하고 목록으로 이동
                </button>
            </div>
        </section>

    </main>

    <script>
        // ================= 1. 빵꾸노트 데이터 =================
        const fillDataRaw = [
            { category: "수와 연산", sentences: [
                "음수 개념은 수 개념을 '크기'로만 생각하는 기존 관념 때문에 [인식론적 장애]를 겪었다.",
                "음수는 방정식 풀이의 [일반성]을 확보하려는 형식적인 요구에서 발생했다.",
                "우체부 모델에서 어음은 양수, 고지서는 음수이며, 가져가는 것은 [뺄셈]이다.",
                "수직선 모델은 하나의 기호(-)가 왼쪽 방향, 반대 방향, 뺄셈 등 [다중적인] 의미를 내포한다.",
                "대수적 구조를 확장할 때 기존 체계의 성질이 유지되도록 하는 것을 [형식불역의 원리]라 한다."
            ]},
            { category: "대수/함수", sentences: [
                "대수 발달 단계 중 미지수뿐만 아니라 주어진 양도 문자로 나타내는 단계는 [기호적] 대수 단계이다.",
                "학생들이 대수식을 연산을 실행하여 완결시켜야 한다고 생각하는 것은 [산술] 학습의 영향이다.",
                "함수의 발생 근원은 변화하는 현상에서 두 변수 사이의 [종속성]을 파악하는 데 있다.",
                "Dirichlet는 규칙성에 얽매이지 않는 [임의의 대응]으로 함수를 정의하였다.",
                "함수 그래프 해석 중, 어떤 상황을 수량화되지 않은 상태로 개략적으로 표현하는 것을 [질적] 접근이라 한다."
            ]},
            { category: "기하/확통", sentences: [
                "인간이 참으로 인정하는 사실을 공리로 상정하고 명제를 이끌어내는 것을 [공리적] 방법이라 한다.",
                "결론이 참인 것으로 가정하고 선행 조건을 거꾸로 탐색해 나가는 방식을 [분석적] 방법이라 한다.",
                "Fischbein은 확률 개념을 바르게 이해하려면 자연스러운 [직관]을 거부하는 태도가 필요하다고 보았다.",
                "판단을 내릴 때 표본 크기에 관계없이 모집단과 유사할 것이라 기대하는 전략은 [대표성] 전략이다.",
                "통계그래프를 다각도로 분석하여 자료 이면에 담긴 의미를 도출할 수 있는 특성은 [현시성]이다."
            ]}
        ];

        // ================= 2. 실전 객관식 데이터 (총 100제 = 20문항 * 5세트, 중복 없음) =================
        const setTitles = [
            { title: "제1세트: 수와 연산 · 대수 영역", desc: "음수 지도 모델, 형식불역의 원리, 변수 개념, 대수적 사고 전략 등" },
            { title: "제2세트: 함수 · 해석학 영역", desc: "함수의 발달 단계, 일가성과 임의성, 극한의 직관/형식적 정의 등" },
            { title: "제3세트: 기하와 증명 영역", desc: "공리적 방법, 국소적 조직화, 라카토스 증명론, 개념 이미지 등" },
            { title: "제4세트: 확률과 통계 영역", desc: "피셔바인 직관, 판단전략, 통계적 소양, 탐색적 자료 분석 등" },
            { title: "제5세트: 교육과정 및 수교론 종합", desc: "2022 개정 성취기준, 교수학습 유의사항, 평가 방법 종합 등" }
        ];

        // 하드코딩된 100개의 개별 문항 데이터
        const quizDataSets = [
            [ // Set 1: 수와 연산/대수 (20문제)
                { q: "음수 개념 도입의 역사적 맥락에 대한 설명으로 올바른 것은?", options: ["음수는 측정을 위한 양적 도구로서 가장 먼저 발생했다.", "음수 도입 시 수 개념을 '크기'로 연관짓는 것은 인식론적 장애를 유발했다.", "Hankel은 음수를 실생활 모델에 엄밀하게 대응시켜 정의했다.", "방정식의 해집합 구조보다 일상적 셈의 필요성이 음수 도입의 주된 요인이었다."], ans: 1, exp: "수 개념을 '크기'와 관련짓는 것은 자연수 학습엔 유용하지만 음수 학습엔 방해가 되는 인식론적 장애입니다." },
                { q: "다음 중 음수 지도 모델인 '셈돌 모델'의 한계로 가장 적절한 것은?", options: ["덧셈과 뺄셈 과정을 직관적으로 설명하기 어렵다.", "양수와 음수의 크기 비교를 가장 명확히 보여준다.", "곱셈과 나눗셈을 설명할 때 임의의 규칙을 선언해야만 하는 한계가 있다.", "소멸 법칙을 이해하는 데 인지적 부담이 매우 크다."], ans: 2, exp: "셈돌 모델은 덧셈과 뺄셈에는 직관적이나 곱셈과 나눗셈을 설명할 때 억지스러운 규칙(검은돌×흰돌=흰돌 등)을 선언해야 하는 한계가 있습니다." },
                { q: "형식불역의 원리에 대한 설명으로 거리가 먼 것은?", options: ["대수적 구조를 확장할 때 기존 체계에서 인정된 성질이 유지되도록 한다.", "Freudenthal은 자연수 체계의 확장으로 음수를 지도할 것을 주장했다.", "해석 기하학의 도입은 대수적 형식불역이 기하적으로 유지됨을 보여준다.", "조작적 관점에서 벗어나 오직 공리 체계 내의 논리적 모순 찾기에 집중하는 원리이다."], ans: 3, exp: "형식불역의 원리는 기존 체계의 연산 법칙(교환, 결합 등)이 확장된 수 체계에서도 성립하도록 정의하는 구조적 원리입니다." },
                { q: "대수적 사고의 발달 단계 중, 미지수를 표현하기 위해 문자나 축약된 기호를 사용하기 시작한 단계는?", options: ["언어적 대수 단계", "생략적 대수 단계", "기호적 대수 단계", "구조적 대수 단계"], ans: 1, exp: "자주 반복되는 개념이나 미지수를 축약된 용어나 머리글자로 나타낸 단계는 '생략적 대수 단계'입니다." },

        // ================= 3. 상태 관리 및 로직 =================
        let currentTab = 'quiz';
        let currentCategory = '전체';
        let currentQuizSetIndex = null;
        let quizStates = [[], [], [], [], []];
        let fillQuestions = [];

        function initData() {
            let idCounter = 0;
            fillDataRaw.forEach(cat => {
                cat.sentences.forEach(sentence => {
                    const parsed = parseSentence(sentence);
                    fillQuestions.push({
                        id: `fill_${idCounter++}`,
                        category: cat.category,
                        html: parsed.html,
                        answers: parsed.answers,
                        blankCount: parsed.answers.length
                    });
                });
            });
            quizDataSets.forEach((set, i) => {
                quizStates[i] = new Array(set.length).fill(null);
            });
        }

        function parseSentence(text) {
            const regex = /\[(.*?)\]/g;
            let match;
            let html = text;
            let answers = [];
            let blankIndex = 0;
            
            while ((match = regex.exec(text)) !== null) {
                const answer = match[1];
                answers.push(answer);
                const inputWidth = Math.max(3, answer.length) + 1; 
                const inputTag = `<input type="text" data-ans="${answer}" data-solved="false" data-idx="${blankIndex}" class="blank-input w-${inputWidth}rem" style="width: ${inputWidth}em" autocomplete="off">`;
                html = html.replace(`[${answer}]`, inputTag);
                blankIndex++;
            }
            return { html, answers };
        }

        // ================= 4. UI 렌더링 =================
        function renderCategoryFilter() {

                    class="whitespace-nowrap px-4 py-2 rounded-full text-sm font-semibold transition-colors ${currentCategory === cat ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}">
                    ${cat}
                </button>
            `).join('');
            document.getElementById('current-category-title').innerText = currentCategory;
        }

        function filterCategory(cat) {
            currentCategory = cat;
            renderCategoryFilter();
            renderFillContent();
        }

        function renderFillContent() {
            const container = document.getElementById('fill-content');
            const filtered = currentCategory === '전체' ? fillQuestions : fillQuestions.filter(q => q.category === currentCategory);
            container.innerHTML = filtered.map(q => `

            `).join('');
            updateProgressUI();
        }

            const container = document.getElementById('dashboard-cards-container');

                const totalCount = set.length;
                const isCompleted = solvedCount === totalCount;
                
                return `

                    <div>

                            <span class="text-indigo-600 bg-indigo-50 text-xs font-bold px-3 py-1 rounded-full border border-indigo-100">SET 0${i+1} · ${totalCount}문항</span>
                            <span class="text-xs font-bold px-3 py-1 rounded-full ${isCompleted ? 'bg-emerald-50 text-emerald-600 border border-emerald-100' : (solvedCount > 0 ? 'bg-amber-50 text-amber-600 border border-amber-100' : 'bg-slate-50 text-slate-500 border border-slate-200')}">

                    </div>
                    <div class="mt-8 flex justify-between items-center border-t border-slate-100 pt-4">
                        <span class="text-xs text-slate-400 font-medium">객관식 4지선다 · 문항·보기 무조건 셔플</span>
                        <span class="text-indigo-600 font-bold text-sm flex items-center gap-1 group-hover:text-indigo-800 transition-colors">

        function enterQuizSet(index) {
            currentQuizSetIndex = index;

            // [요청 반영] 세트 진입 시 맞히든 틀리든 문제 상태(state) 무조건 리셋
            quizStates[index] = new Array(quizDataSets[index].length).fill(null);

            // 문제 순서 100% 무작위 셔플
            const currentSet = quizDataSets[index];
            for (let j = currentSet.length - 1; j > 0; j--) {
                const k = Math.floor(Math.random() * (j + 1));
                [currentSet[j], currentSet[k]] = [currentSet[k], currentSet[j]];
            }

            // 보기 셔플 속성 초기화 (새로 진입 시 무조건 다시 섞이도록 유도)
            currentSet.forEach(q => {
                delete q.shuffledOptions;

            document.getElementById('view-quiz-dashboard').classList.add('hidden');
            document.getElementById('view-quiz-solve').classList.remove('hidden');
            document.getElementById('progress-container').classList.remove('hidden');

            renderQuizContent();

        function renderQuizContent() {
            const container = document.getElementById('quiz-content');
            const currentQuizSet = quizDataSets[currentQuizSetIndex];
            const currentState = quizStates[currentQuizSetIndex];
            
            container.innerHTML = currentQuizSet.map((q, i) => {
                const state = currentState[i];
                const isSolved = state !== null;
                
                // 보기 순서 무작위 셔플 (초기화 되어있으므로 무조건 재배치됨)
                if (!isSolved || !q.shuffledOptions) {
                    let opts = q.options.map((text, idx) => ({ text, originalIdx: idx }));
                    for (let j = opts.length - 1; j > 0; j--) {
                        const k = Math.floor(Math.random() * (j + 1));
                        [opts[j], opts[k]] = [opts[k], opts[j]];
                    }
                    q.shuffledOptions = opts;
                }
                
                return `
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <div class="flex items-center gap-2 mb-4">
                        <span class="bg-indigo-600 text-white text-xs font-bold px-2 py-1 rounded">Q${i+1}</span>

                    <div class="space-y-3">

                            let btnClasses = 'w-full text-left p-4 rounded-lg border-2 transition-all font-medium flex gap-3 items-center';
                            if (!isSolved) {
                                btnClasses += ' border-slate-100 hover:border-indigo-400 hover:bg-indigo-50 text-slate-700';
                            } else {
                                if (opt.originalIdx === q.ans) {
                                    btnClasses += ' border-emerald-500 bg-emerald-50 text-emerald-800 shadow-sm';
                                } else if (opt.originalIdx === state.selectedOriginalIdx && !state.isCorrect) {
                                    btnClasses += ' border-rose-500 bg-rose-50 text-rose-800';
                                } else {
                                    btnClasses += ' border-slate-100 text-slate-400 opacity-60';
                                }
                            }
                            const numBadge = `<span class="inline-flex justify-center items-center w-6 h-6 rounded-full border ${isSolved ? 'border-current' : 'border-slate-300'} text-xs shrink-0">${optIdx+1}</span>`;
                            return `<button onclick="handleQuizAnswer(${i}, ${optIdx}, ${opt.originalIdx})" id="quiz-btn-${i}-${optIdx}" class="${btnClasses}" ${isSolved ? 'disabled' : ''}>
                                ${numBadge} <span>${opt.text}</span>
                            </button>`;
                        }).join('')}
                    </div>
                    <div id="exp-box-${i}" class="exp-box bg-slate-50 border border-slate-200 rounded-lg p-5 ${isSolved ? 'show' : ''}" ${isSolved ? 'style="max-height:800px; opacity:1; margin-top:1.5rem;"' : ''}>
                        <div class="flex items-start gap-3">
                            <span class="text-2xl mt-1">💡</span>
                            <div>
                                <h4 class="font-bold text-slate-800 mb-2">핵심 해설</h4>
                                <p class="text-slate-600 text-sm leading-relaxed">${q.exp}</p>
                            </div>
                        </div>
                    </div>
                </div>
            `}).join('');
            
            updateProgressUI();
        }

        // ================= 5. 이벤트 핸들러 (빵꾸노트) =================
        document.getElementById('fill-content').addEventListener('input', (e) => {
            if (e.target.tagName !== 'INPUT' || e.target.dataset.solved === 'true') return;
            if (e.target.value.trim() === e.target.dataset.ans) {
                markCorrect(e.target);
                focusNext(e.target);
                updateProgressUI();
            }
        });
        document.getElementById('fill-content').addEventListener('keydown', (e) => {
            if (e.target.tagName !== 'INPUT' || e.key !== 'Enter' || e.target.dataset.solved === 'true') return;
            e.preventDefault();
            const val = e.target.value.trim();
            if (val === e.target.dataset.ans) markCorrect(e.target);
            else markWrong(e.target, val);
            focusNext(e.target);
            updateProgressUI();
        });
        document.getElementById('fill-content').addEventListener('focusout', (e) => {
            if (e.target.tagName !== 'INPUT' || e.target.dataset.solved === 'true') return;
            const val = e.target.value.trim();
            if (val !== "") {
                if (val === e.target.dataset.ans) markCorrect(e.target);
                else markWrong(e.target, val);
                updateProgressUI();
            }
        });

        function markCorrect(input) {
            input.value = input.dataset.ans;
            input.classList.add('correct');
            input.dataset.solved = 'true';
            input.disabled = true;
        }
        function markWrong(input, wrongVal) {
            input.value = input.dataset.ans;
            input.classList.add('wrong-revealed');
            input.dataset.solved = 'true';
            input.disabled = true;
            input.title = `나의 오답: ${wrongVal || '빈칸'}`;
        }
        function focusNext(currentInput) {
            const inputs = Array.from(document.querySelectorAll('.blank-input'));
            const idx = inputs.indexOf(currentInput);
            for(let i = idx + 1; i < inputs.length; i++) {
                if (inputs[i].dataset.solved !== 'true') { inputs[i].focus(); break; }
            }
        }
        function revealAllUnanswered() {
            document.querySelectorAll('.blank-input[data-solved="false"]').forEach(input => markWrong(input, ""));
            updateProgressUI();
        }

            const currentState = quizStates[currentQuizSetIndex];
            if (currentState[qIdx] !== null) return; 
            const qData = quizDataSets[currentQuizSetIndex][qIdx];
            const isCorrect = (qData.ans === selectedOriginalIdx);
            
            currentState[qIdx] = { isCorrect, selectedRenderIdx, selectedOriginalIdx };

            document.querySelectorAll(`[id^="quiz-btn-${qIdx}-"]`).forEach((btn, idx) => {
                btn.disabled = true;
                btn.classList.remove('hover:border-indigo-400', 'hover:bg-indigo-50');
                const optOriginalIdx = qData.shuffledOptions[idx].originalIdx;
                
                if (optOriginalIdx === qData.ans) {
                    btn.classList.add('border-emerald-500', 'bg-emerald-50', 'text-emerald-800');
                    btn.classList.remove('border-slate-100', 'text-slate-700', 'border-slate-300');
                } else if (idx === selectedRenderIdx && !isCorrect) {
                    btn.classList.add('border-rose-500', 'bg-rose-50', 'text-rose-800');
                    btn.classList.remove('border-slate-100', 'text-slate-700', 'border-slate-300');
                } else {
                    btn.classList.add('opacity-60');
                }
            });

            document.getElementById(`exp-box-${qIdx}`).classList.add('show');
            document.getElementById(`exp-box-${qIdx}`).style = "";
            updateProgressUI();
        }

        // ================= 7. 공통 UI 업데이트 =================
        function switchTab(tabId) {
            currentTab = tabId;
            const navQuiz = document.getElementById('nav-quiz');
            const navFill = document.getElementById('nav-fill');
            const progressContainer = document.getElementById('progress-container');

            if (tabId === 'quiz') {
                navQuiz.className = "px-4 py-1.5 rounded-full text-sm font-bold bg-white text-indigo-700 shadow-sm border border-slate-200 flex items-center gap-1 transition-all";
                navFill.className = "px-4 py-1.5 rounded-full text-sm font-medium text-slate-500 hover:text-slate-800 border border-transparent flex items-center gap-1 transition-all";
                
                document.getElementById('view-fill').classList.add('hidden');
                
                // 만약 현재 객관식 세트에 진입해 있지 않다면 대시보드를 보여줌
                if (currentQuizSetIndex === null) {
                    document.getElementById('view-quiz-dashboard').classList.remove('hidden');
                    document.getElementById('view-quiz-solve').classList.add('hidden');
                    progressContainer.classList.add('hidden');
                } else {
                    document.getElementById('view-quiz-dashboard').classList.add('hidden');
                    document.getElementById('view-quiz-solve').classList.remove('hidden');
                    progressContainer.classList.remove('hidden');
                    document.getElementById('progress-title').innerText = `현재 세트 진행률`;
                }
            } else {
                navFill.className = "px-4 py-1.5 rounded-full text-sm font-bold bg-white text-indigo-700 shadow-sm border border-slate-200 flex items-center gap-1 transition-all";
                navQuiz.className = "px-4 py-1.5 rounded-full text-sm font-medium text-slate-500 hover:text-slate-800 border border-transparent flex items-center gap-1 transition-all";

                document.getElementById('view-fill').classList.remove('hidden');
                document.getElementById('view-quiz-dashboard').classList.add('hidden');
                document.getElementById('view-quiz-solve').classList.add('hidden');
                
                progressContainer.classList.remove('hidden');
                document.getElementById('progress-title').innerText = "빈칸 인출 진행률";
            }
            updateProgressUI();
        }

        function updateProgressUI() {
            let total = 0, correct = 0, wrong = 0;

            if (currentTab === 'fill') {
                const inputs = document.querySelectorAll('.blank-input');
                total = inputs.length;
                inputs.forEach(input => {
                    if (input.classList.contains('correct')) correct++;
                    if (input.classList.contains('wrong-revealed')) wrong++;
                });
            } else if (currentTab === 'quiz' && currentQuizSetIndex !== null) {
                // 문제 풀이 화면: 현재 세트(20문제) 기준 계산
                const currentState = quizStates[currentQuizSetIndex];
                total = currentState.length;
                currentState.forEach(s => {
                    if (s !== null) { if(s.isCorrect) correct++; else wrong++; }
                });
                document.getElementById('solve-set-progress').innerText = `${correct+wrong}/${total}`;
            }

            // UI 갱신 (프로그레스 바 텍스트 및 게이지)
            document.getElementById('progress-text').innerText = `${correct + wrong}/${total}`;
            document.getElementById('count-correct').innerText = correct;
            document.getElementById('count-wrong').innerText = wrong;

            const cPer = total === 0 ? 0 : (correct / total) * 100;
            const wPer = total === 0 ? 0 : (wrong / total) * 100;

            document.getElementById('bar-correct').style.width = `${cPer}%`;
            document.getElementById('bar-wrong').style.width = `${wPer}%`;
        }

        // ================= 초기화 =================
        window.onload = () => {
            initData();
            renderCategoryFilter();
            renderFillContent();
            renderQuizDashboard();
            switchTab('quiz'); // 기본 화면을 객관식 대시보드로 시작
        };
    </script>
</body>
</html>
